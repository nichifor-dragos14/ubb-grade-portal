<mat-drawer-container class="container">
  <mat-drawer #drawer class="sidenav" mode="side" opened>
    <div class="brand">
      <img id="logo" src="assets/app-logo.png" alt="UBB logo" />
    </div>

    <div class="nav-scroll">
      <mat-nav-list class="nav-list">
        <!-- STUDENT -->
        <ng-container *ngIf="hasRole('Student')">
          <a
            mat-list-item
            (click)="onSectionNavigate('/main/student/dashboard')"
            [class.active]="isSectionActive('/main/student/dashboard')"
          >
            <mat-icon matListItemIcon>dashboard</mat-icon>
            <div matListItemTitle>Dashboard</div>
          </a>
          <a
            mat-list-item
            (click)="onSectionNavigate('/main/student/enrollments')"
            [class.active]="isSectionActive('/main/student/enrollments')"
          >
            <mat-icon matListItemIcon>how_to_reg</mat-icon>
            <div matListItemTitle>My Enrollments</div>
          </a>

          <a
            mat-list-item
            (click)="onSectionNavigate('/main/student/leaderboards')"
            [class.active]="isSectionActive('/main/student/leaderboards')"
          >
            <mat-icon matListItemIcon>leaderboard</mat-icon>
            <div matListItemTitle>Leaderboards</div>
          </a>
        </ng-container>

        <!-- PROFESSOR -->
        <ng-container *ngIf="hasRole('Professor')">
          <a
            mat-list-item
            (click)="onSectionNavigate('/main/professor/dashboard')"
            [class.active]="isSectionActive('/main/professor/dashboard')"
          >
            <mat-icon matListItemIcon>dashboard</mat-icon>
            <div matListItemTitle>Dashboard</div>
          </a>
          <a
            mat-list-item
            (click)="onSectionNavigate('/main/professor/courses')"
            [class.active]="isSectionActive('/main/professor/courses')"
          >
            <mat-icon matListItemIcon>library_books</mat-icon>
            <div matListItemTitle>My Courses</div>
          </a>

          <a
            mat-list-item
            (click)="onSectionNavigate('/main/professor/feedback')"
            [class.active]="isSectionActive('/main/professor/feedback')"
          >
            <mat-icon matListItemIcon>rule</mat-icon>
            <div matListItemTitle>Activity Feedback</div>
          </a>
        </ng-container>

        <!-- ADMIN -->
        <ng-container *ngIf="hasRole('Admin')">
          <a
            mat-list-item
            (click)="onSectionNavigate('/main/admin/users')"
            [class.active]="isSectionActive('/main/admin/users')"
          >
            <mat-icon matListItemIcon>group</mat-icon>
            <div matListItemTitle>Edit Users</div>
          </a>

          <a
            mat-list-item
            (click)="onSectionNavigate('/main/admin/professors')"
            [class.active]="isSectionActive('/main/admin/professors')"
          >
            <mat-icon matListItemIcon>person_add</mat-icon>
            <div matListItemTitle>Add Professor</div>
          </a>
        </ng-container>
      </mat-nav-list>
    </div>

    <div class="sidenav-footer">
      <button mat-stroked-button color="primary" (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  </mat-drawer>

  <mat-drawer-content class="content">
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button class="menu-btn" (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="title">UBB Learning Portal</span>
      <span class="spacer"></span>

      <!-- Notifications -->
      <button
        mat-icon-button
        class="notif-button"
        [matMenuTriggerFor]="notificationsMenu"
        [matBadge]="unreadCount()"
        matBadgeColor="accent"
        matBadgePosition="above after"
        [matBadgeHidden]="unreadCount() === 0"
        matTooltip="Notifications"
      >
        <mat-icon>notifications</mat-icon>
      </button>

      <mat-menu
        #notificationsMenu="matMenu"
        xPosition="before"
        class="notif-panel"
      >
        <div class="notif-header">
          <span>Notifications 🔔</span>
          <div class="notif-actions">
            <span class="notif-count">{{ unreadCount() }} unread</span>
            <button
              mat-icon-button
              class="notif-read-btn"
              (click)="onMarkAllRead()"
              [disabled]="unreadCount() === 0"
              matTooltip="Mark all as read"
            >
              <mat-icon>done_all</mat-icon>
            </button>
          </div>
        </div>

        <ng-container *ngIf="notifications().length > 0; else noNotifications">
          <button
            mat-menu-item
            type="button"
            class="notif-item"
            *ngFor="let notification of notifications()"
            [class.unread]="!notification.isRead"
            (click)="onNotificationClick(notification)"
          >
            <mat-icon class="notif-status" *ngIf="!notification.isRead">
              notifications_active
            </mat-icon>
            <mat-icon class="notif-status read" *ngIf="notification.isRead">
              notifications
            </mat-icon>
            <div class="notif-body">
              <span class="notif-text">{{ notification.message }}</span>
              <span class="notif-time">
                {{ notification.createdOn | date: 'MMM d, y' }}
                {{ notification.createdOn | date: 'shortTime' }}
              </span>
            </div>
          </button>
        </ng-container>

        <ng-template #noNotifications>
          <div class="notif-empty">No notifications yet.</div>
        </ng-template>
      </mat-menu>
    </mat-toolbar>

    <div class="page">
      <router-outlet />
    </div>
  </mat-drawer-content>
</mat-drawer-container>
