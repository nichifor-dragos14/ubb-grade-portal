<app-page-header title="Add professor"></app-page-header>

<section class="card">
  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>First name</mat-label>
      <input matInput formControlName="firstName" />
      <mat-error
        *ngIf="
          form.controls.firstName.touched && form.controls.firstName.invalid
        "
      >
        First name is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Last name</mat-label>
      <input matInput formControlName="lastName" />
      <mat-error
        *ngIf="form.controls.lastName.touched && form.controls.lastName.invalid"
      >
        Last name is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
      <mat-error
        *ngIf="
          form.controls.email.touched &&
          form.controls.email.hasError('required')
        "
      >
        Email is required.
      </mat-error>
      <mat-error
        *ngIf="
          form.controls.email.touched && form.controls.email.hasError('email')
        "
      >
        Must be a valid email.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" />
      <mat-error
        *ngIf="
          form.controls.password.touched &&
          form.controls.password.hasError('required')
        "
      >
        Password is required.
      </mat-error>
      <mat-error
        *ngIf="
          form.controls.password.touched &&
          form.controls.password.hasError('minlength')
        "
      >
        Minimum 8 characters.
      </mat-error>
    </mat-form-field>

    <div class="actions">
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="form.invalid || isSubmitting"
      >
        Create professor
      </button>
      <div class="spinner" *ngIf="isSubmitting">
        <mat-progress-spinner
          mode="indeterminate"
          diameter="32"
        ></mat-progress-spinner>
      </div>
    </div>
  </form>
</section>
