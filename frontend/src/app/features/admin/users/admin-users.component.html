<app-page-header title="Edit users 🧑‍💼">
  <button mat-button color="primary" button routerLink="add-professor">
    ADD PROFESSOR
  </button>
</app-page-header>

<section class="card">
  <div class="toolbar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search users</mat-label>
      <input
        matInput
        [formControl]="filterControl"
        placeholder="Search by name"
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="role-filter">
      <mat-label>Role</mat-label>
      <mat-select [formControl]="roleFilterControl">
        <mat-option value="">All roles</mat-option>
        <mat-option value="Student">Student</mat-option>
        <mat-option value="Professor">Professor</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="loader" *ngIf="isLoading">
    <mat-progress-spinner mode="indeterminate" diameter="48">
    </mat-progress-spinner>
  </div>

  <div class="empty" *ngIf="!isLoading && users.length === 0">
    No users match your search.
  </div>

  <div class="user-list" *ngIf="!isLoading && users.length > 0">
    <div class="user-row" *ngFor="let user of users">
      <div class="user-main">
        <div class="user-name">{{ user.firstName }} {{ user.lastName }}</div>
        <div class="user-meta">{{ user.email }}</div>
        <div class="user-tags">
          <span
            class="tag"
            [ngClass]="{
              'role-student': user.role === 'Student',
              'role-professor': user.role === 'Professor',
            }"
          >
            {{ user.role }}
          </span>
          <span class="tag banned" *ngIf="user.isBanned">Banned</span>
        </div>
      </div>

      <button
        mat-stroked-button
        color="warn"
        type="button"
        *ngIf="!user.isBanned"
        [disabled]="isUpdating(user)"
        (click)="banUser(user)"
      >
        Ban
      </button>
      <button
        mat-stroked-button
        color="primary"
        type="button"
        *ngIf="user.isBanned"
        [disabled]="isUpdating(user)"
        (click)="unbanUser(user)"
      >
        Unban
      </button>
    </div>
  </div>
</section>

<mat-paginator
  *ngIf="usersCount > 0"
  [length]="usersCount"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  showFirstLastButtons
  (page)="onPageChange($event)"
>
</mat-paginator>

<router-outlet />
