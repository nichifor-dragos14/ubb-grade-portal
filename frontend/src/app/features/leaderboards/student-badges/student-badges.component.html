<section class="badges-card">
  <div class="card-title">Your badges 🏅</div>

  <div class="badges-grid" *ngIf="badges.length > 0; else empty">
    <div class="badge" *ngFor="let badge of pagedBadges">
      <div class="badge-icon" [ngClass]="getBadgeClass(badge.position)">
        <mat-icon>emoji_events</mat-icon>
        <span class="badge-rank">#{{ badge.position }}</span>
      </div>
      <div class="badge-body">
        <div class="badge-message">{{ badge.message }}</div>
        <div class="badge-meta">
          Awarded {{ badge.createdOn | date: 'mediumDate' }}
        </div>
      </div>
    </div>
  </div>

  <div class="pager" *ngIf="pageCount > 1">
    <button
      mat-stroked-button
      type="button"
      (click)="prevPage()"
      [disabled]="pageIndex === 0"
    >
      Previous
    </button>
    <div class="pager-info">Page {{ pageIndex + 1 }} of {{ pageCount }}</div>
    <button
      mat-stroked-button
      type="button"
      (click)="nextPage()"
      [disabled]="pageIndex + 1 >= pageCount"
    >
      Next
    </button>
  </div>

  <ng-template #empty>
    <div class="empty">No badges yet. Keep submitting activities!</div>
  </ng-template>
</section>
