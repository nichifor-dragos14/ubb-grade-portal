<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="center">
    <mat-card class="auth-card">
      <header class="heading">
        <h1>Welcome back</h1>
        <p>Log in to resume your journey!</p>
      </header>

      <div class="overlay" *ngIf="isLoading">
        <mat-progress-spinner mode="indeterminate" diameter="48">
        </mat-progress-spinner>
      </div>

      <form
        [formGroup]="loginFormGroup"
        (ngSubmit)="onSubmitForm()"
        class="form"
      >
        <mat-form-field>
          <mat-label>Email</mat-label>
          <mat-icon matPrefix>mail</mat-icon>
          <input
            matInput
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
            formControlName="email"
            required
          />

          <mat-error *ngIf="email.touched && email.hasError('required')">
            The email is required.
          </mat-error>

          <mat-error *ngIf="email.touched && email.hasError('email')">
            Must be in email format
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hide ? 'password' : 'text'"
            autocomplete="current-password"
            placeholder="Enter your password"
            formControlName="password"
            required
          />

          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hide = !hide"
            [attr.aria-label]="'Toggle password visibility'"
          >
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>

          <mat-error *ngIf="password.touched && password.hasError('required')">
            Password is required
          </mat-error>

          <mat-error *ngIf="password.touched && password.hasError('minlength')">
            Minimum 8 characters
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="submit"
          type="submit"
          [disabled]="loginFormGroup.invalid || isLoading"
        >
          <span>Log in</span>
        </button>

        <div class="alt">
          <span>Don't have an account? Create one </span>
          <a routerLink="/register">here</a>
        </div>
      </form>
    </mat-card>

    <img class="brand" src="assets/app-logo.png" alt="UBB logo" />
  </div>
</div>
